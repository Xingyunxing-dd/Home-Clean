<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿舍清洁轮值打卡</title>
<style>
  :root {
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --orange: #ef6c00;
    --orange-light: #fff3e0;
    --bg: #f5f7f5;
    --card: #ffffff;
    --text: #263238;
    --text-sub: #78909c;
    --border: #e0e6e0;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 14px 40px;
  }
  header { text-align: center; padding: 18px 0 8px; }
  header h1 { font-size: 22px; font-weight: 700; }
  header .sub { color: var(--text-sub); font-size: 13px; margin-top: 4px; }
  .members { display: flex; justify-content: center; gap: 10px; margin: 12px 0 4px; }
  .member-chip {
    background: var(--green-light);
    color: var(--green);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 600;
  }
  .task-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .task-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .task-head { display: flex; justify-content: space-between; align-items: center; }
  .task-name { font-size: 16px; font-weight: 700; }
  .current-label { font-size: 12px; color: var(--text-sub); margin-top: 6px; }
  .current-name {
    display: inline-block;
    margin-top: 4px;
    background: var(--orange-light);
    color: var(--orange);
    font-weight: 700;
    font-size: 15px;
    padding: 3px 12px;
    border-radius: 8px;
  }
  .checkin-btn {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .checkin-btn:active { opacity: 0.75; }
  .checkin-btn:disabled { background: #b0bec5; cursor: not-allowed; }
  .toast-wrap {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 24px;
    width: min(92%, 520px);
    z-index: 99;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    background: #263238;
    color: #fff;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    animation: rise 0.25s ease;
  }
  .toast.ok { background: var(--green); }
  .toast.err { background: #c62828; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .history { margin-top: 26px; }
  .history h2 { font-size: 16px; margin-bottom: 10px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-sub);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 13px;
    cursor: pointer;
  }
  .tab.active { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  .hist-list { display: flex; flex-direction: column; gap: 8px; }
  .hist-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hist-item .who { font-weight: 600; font-size: 14px; }
  .hist-item .task { color: var(--text-sub); font-size: 13px; }
  .hist-item .when { color: var(--text-sub); font-size: 12px; }
  .empty { color: var(--text-sub); text-align: center; font-size: 13px; padding: 18px 0; }
  .loading { text-align: center; color: var(--text-sub); padding: 20px; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <h1>宿舍清洁轮值打卡</h1>
    <div class="sub">打卡后自动切换到下一位，记得看提醒哦</div>
    <div class="members">
      <span class="member-chip">幸运星</span>
      <span class="member-chip">Wi</span>
    </div>
  </header>

  <div class="task-list" id="taskList">
    <div class="loading">加载中…</div>
  </div>

  <div class="history">
    <h2>打卡历史</h2>
    <div class="tabs" id="tabs"></div>
    <div class="hist-list" id="histList">
      <div class="empty">暂无记录</div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

<script>
const TASKS = [
  { id: "clean_room", name: "打扫卫生" },
  { id: "toilet_trash", name: "扔厕所垃圾" },
  { id: "living_trash", name: "扔客厅垃圾" }
];
let state = null;
let members = [];
let activeTask = null; // null = 全部

const $ = (sel) => document.querySelector(sel);

function toast(msg, type = "ok") {
  const wrap = $("#toastWrap");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.remove(); }, 3200);
}

function formatTime(iso) {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderTasks() {
  const list = $("#taskList");
  list.innerHTML = "";
  for (const t of TASKS) {
    const curId = state[t.id];
    const cur = members.find((m) => m.id === curId);
    const card = document.createElement("div");
    card.className = "task-card";
    card.innerHTML = `
      <div class="task-head">
        <div>
          <div class="task-name">${t.name}</div>
          <div class="current-label">当前轮到</div>
          <div class="current-name">${cur ? cur.name : "未知"}</div>
        </div>
        <button class="checkin-btn" data-task="${t.id}">打卡</button>
      </div>`;
    list.appendChild(card);
  }
  document.querySelectorAll(".checkin-btn").forEach((btn) => {
    btn.addEventListener("click", () => onCheckin(btn.dataset.task));
  });
}

async function onCheckin(taskId) {
  const curId = state[taskId];
  const cur = members.find((m) => m.id === curId);
  const task = TASKS.find((t) => t.id === taskId);
  if (!cur) return;
  if (!confirm(`确认 ${cur.name} 已完成「${task.name}」？`)) return;
  try {
    const res = await fetch("/api/checkin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ taskId, memberId: cur.id })
    });
    const data = await res.json();
    if (!data.ok) { toast(data.error || "打卡失败", "err"); return; }
    state = data.state;
    renderTasks();
    loadHistory();
    toast(data.reminderText, "ok");
  } catch (e) {
    toast("网络错误，请重试", "err");
  }
}

function renderTabs() {
  const tabsEl = $("#tabs");
  tabsEl.innerHTML = "";
  const items = [{ id: null, name: "全部" }, ...TASKS];
  for (const t of items) {
    const btn = document.createElement("button");
    btn.className = "tab" + (activeTask === t.id ? " active" : "");
    btn.textContent = t.name;
    btn.addEventListener("click", () => {
      activeTask = t.id;
      renderTabs();
      loadHistory();
    });
    tabsEl.appendChild(btn);
  }
}

async function loadHistory() {
  const url = activeTask ? `/api/history?taskId=${activeTask}` : "/api/history";
  try {
    const res = await fetch(url);
    const data = await res.json();
    const list = $("#histList");
    if (!data.ok || !data.history.length) {
      list.innerHTML = '<div class="empty">暂无记录</div>';
      return;
    }
    list.innerHTML = "";
    for (const r of data.history) {
      const member = members.find((m) => m.id === r.memberId);
      const task = TASKS.find((t) => t.id === r.taskId);
      const item = document.createElement("div");
      item.className = "hist-item";
      item.innerHTML = `
        <div>
          <div class="who">${member ? member.name : "未知"}</div>
          <div class="task">${task ? task.name : r.taskId}</div>
        </div>
        <div class="when">${formatTime(r.completedAt)}</div>`;
      list.appendChild(item);
    }
  } catch (e) {
    $("#histList").innerHTML = '<div class="empty">加载失败</div>';
  }
}

async function init() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    if (!data.ok) {
      $("#taskList").innerHTML = '<div class="empty">加载失败：' + (data.error || "") + "</div>";
      return;
    }
    state = data.state;
    members = data.members;
    renderTasks();
    renderTabs();
    loadHistory();
  } catch (e) {
    $("#taskList").innerHTML = '<div class="empty">无法连接服务器，请检查网络</div>';
  }
}

init();
</script>
</body>
</html>
